# pnpm settings for this repo (it uses pnpm, never npm: dotfiles D-20261006-A10).

# js-yaml (pulled in by @changesets/cli) had 7 published advisories, all CPU
# denial-of-service; 3.15.2 and 4.3.2 fix every one (both 40 days old on
# 2026-10-06, past the 3-day cooldown).
overrides:
  js-yaml@>=3.0.0 <4.0.0: 3.15.2
  js-yaml@>=4.0.0 <5.0.0: 4.3.2

# Accepted 2026-10-06 (Gavin's pick): no fixed release exists for these two,
# both are denial-of-service only, and both arrive through the dev-only
# changesets tooling; nothing here ships them. audit.ignorePrune (global
# config) drops each id once pnpm audit stops reporting it.
audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm  # braces <=3.0.3, stack exhaustion on deep nesting
    - GHSA-hp3w-g68c-fv3c  # sprintf-js <=1.1.3, unbounded precision specifiers
